[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "descrypt"
version = "0.1.0"
description = "Automated, recursive unpacking of obfuscated malicious JavaScript and PowerShell"
authors = [{ name = "Independent Reproduction" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
descrypt = "descrypt.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
